name: Apply demand-first ranking

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-demand-first-ranking.yml'

permissions:
  contents: write

concurrency:
  group: pokepoke-data-write
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply ranking order
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # Server-side ranking order
          lib_path = Path('scripts/lib.mjs')
          lib = lib_path.read_text(encoding='utf-8')
          old_sort = ".sort((a, b) => b.ratioSort - a.ratioSort || b.demand - a.demand || a.supply - b.supply || a.name.localeCompare(b.name, 'ja'))"
          new_sort = ".sort((a, b) => b.demand - a.demand || a.supply - b.supply || a.name.localeCompare(b.name, 'ja'))"
          if old_sort in lib:
              lib = lib.replace(old_sort, new_sort, 1)
          elif new_sort not in lib:
              raise SystemExit('Could not find ranking sort in scripts/lib.mjs')
          lib_path.write_text(lib, encoding='utf-8')

          # Client-side safeguard
          app_path = Path('docs/app.js')
          app = app_path.read_text(encoding='utf-8')
          old_rows = "const rows=w.rankings.filter(x=>(!q||x.name.toLowerCase().includes(q))&&(x.demand+x.supply>=state.min));"
          new_rows = """const rows=w.rankings
            .filter(x=>(!q||x.name.toLowerCase().includes(q))&&(x.demand+x.supply>=state.min))
            .sort((a,b)=>b.demand-a.demand||a.supply-b.supply||a.name.localeCompare(b.name,'ja'));"""
          if old_rows in app:
              app = app.replace(old_rows, new_rows, 1)
          elif new_rows not in app:
              raise SystemExit('Could not find ranking rows in docs/app.js')
          app_path.write_text(app, encoding='utf-8')

          # Visible explanation
          index_path = Path('docs/index.html')
          html = index_path.read_text(encoding='utf-8')
          old_desc = '需要供給比 = 需要 ÷ 供給。供給0で需要ありは「∞」。同率時は需要件数を優先。'
          new_desc = '需要数が多い順に表示し、需要数が同じ場合は供給数が少ないカードを上位にします。'
          if old_desc in html:
              html = html.replace(old_desc, new_desc, 1)
          elif new_desc not in html:
              raise SystemExit('Could not find ranking description in docs/index.html')
          index_path.write_text(html, encoding='utf-8')

          # Update ranking-order test
          test_path = Path('tests/parser.test.mjs')
          test = test_path.read_text(encoding='utf-8')
          old_test = """test('ranking sorts zero-supply demand first', () => {
            const now = new Date('2026-10-03T00:00:00Z');
            const posts = [
              { createdAt: '2026-10-02T23:00:00Z', demand: ['ナツメ'], supply: [] },
              { createdAt: '2026-10-02T22:00:00Z', demand: ['アカギ'], supply: ['アカギ'] }
            ];
            const r = buildRankings(posts, config.cards, now)['24h'].rankings;
            assert.equal(r[0].name, 'ナツメ');
            assert.equal(r[0].ratioDisplay, '∞');
          });"""
          new_test = """test('ranking sorts by demand desc, then supply asc', () => {
            const now = new Date('2026-10-03T00:00:00Z');
            const posts = [
              { createdAt: '2026-10-02T23:00:00Z', demand: ['ナツメ', 'ナツメ'], supply: ['ナツメ'] },
              { createdAt: '2026-10-02T22:00:00Z', demand: ['アカギ', 'アカギ'], supply: [] },
              { createdAt: '2026-10-02T21:00:00Z', demand: ['カスミ'], supply: [] }
            ];
            const r = buildRankings(posts, config.cards, now)['24h'].rankings;
            assert.equal(r[0].name, 'アカギ');
            assert.equal(r[0].demand, 2);
            assert.equal(r[0].supply, 0);
            assert.equal(r[1].name, 'ナツメ');
            assert.equal(r[1].demand, 2);
            assert.equal(r[1].supply, 1);
          });"""
          if old_test in test:
              test = test.replace(old_test, new_test, 1)
          elif new_test not in test:
              raise SystemExit('Could not find ranking test in tests/parser.test.mjs')
          test_path.write_text(test, encoding='utf-8')
          PY

      - name: Test ranking order
        run: node --test tests/parser.test.mjs

      - name: Rebuild ranking JSON
        run: node scripts/rebuild.mjs

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/lib.mjs docs/app.js docs/index.html docs/data/rankings.json tests/parser.test.mjs
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "feat: rank by demand then lower supply"
          git push origin HEAD:main
