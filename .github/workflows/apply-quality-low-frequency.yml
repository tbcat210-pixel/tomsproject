name: Apply quality low-frequency mode

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quality-low-frequency-patch
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply low-frequency quality-preserving settings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          # Keep all 8 broad queries for coverage.
          q = {
              "queries": [
                  "#ポケポケトレード",
                  "#ポケポケ交換",
                  "ポケポケ トレード 求 譲",
                  "ポケポケ トレード 求 出",
                  "ポケポケ ★2 トレード",
                  "ポケポケ ☆2 トレード",
                  "ポケポケ 星2 トレード",
                  "ポケポケ サポート トレード"
              ]
          }
          Path("config/queries.json").write_text(
              json.dumps(q, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )

          # Lower run frequency but allow deeper catch-up per run.
          hp = Path("config/history.json")
          h = json.loads(hp.read_text(encoding="utf-8"))
          h.update({
              "rankingHorizonHours": 168,
              "storageHorizonHours": 192,
              "recentPagesPerQuery": 10,
              "resultsPerPage": 40,
              "throttleMs": 3000,
              "retryCount": 0,
              "imageOcrEnabled": True,
              "imageOcrMaxImagesPerPost": 4,
              "imageOcrMaxNewImagesPerRun": 100,
              "imageOcrTimeoutMs": 30000,
              "imageOcrCacheHours": 216,
              "imageOcrMaxCandidatePasses": 6,
              "imageOcrUpscaleMinWidth": 1500,
              "imageOcrUpscaleMaxWidth": 2600,
              "imageOcrCacheVersion": 3
          })
          hp.write_text(json.dumps(h, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          # Move operational data out of the GitHub Pages publish directory.
          corep = Path("scripts/collector-core.mjs")
          core = corep.read_text(encoding="utf-8")
          core = core.replace(
              "posts: path.join(root, 'docs/data/posts.json'),",
              "posts: path.join(root, '.collector-data/posts.json'),"
          )
          core = core.replace(
              "state: path.join(root, 'docs/data/state.json'),",
              "state: path.join(root, '.collector-data/state.json'),"
          )
          core = core.replace(
              "ocrCache: path.join(root, 'docs/data/ocr-cache.json'),",
              "ocrCache: path.join(root, '.collector-data/ocr-cache.json'),"
          )

          # Save only fields needed by the ranking. This does not change counts.
          old_write = "  await writeJson(paths.posts, posts);"
          new_write = """  const storedPosts = posts.map(p => ({
            id: p.id,
            createdAt: p.createdAt,
            demand: p.demand ?? [],
            supply: p.supply ?? []
          }));
          await writeJson(paths.posts, storedPosts);"""
          if old_write in core and new_write not in core:
              core = core.replace(old_write, new_write, 1)
          corep.write_text(core, encoding="utf-8")

          # Use a 24h fallback window. Normal schedule is every 4h.
          cp = Path("scripts/collect.mjs")
          c = cp.read_text(encoding="utf-8")
          c = c.replace(
              "const recentSince = new Date(now.getTime() - 72 * 3600_000);",
              "const recentSince = new Date(now.getTime() - 24 * 3600_000);"
          )

          # Disable the large daily 7-day/card-by-card backfill.
          marker = "const backfillDue = !lastBackfillMs || now.getTime() - lastBackfillMs >= dueHours * 3600_000;"
          if marker in c:
              c = c.replace(marker, "const backfillDue = false;", 1)
          c = c.replace(
              "console.log(`Historical backfill skipped; last completed at ${state.lastBackfill.completedAt}`);",
              "console.log('Historical bulk backfill disabled; recent catch-up collection only.');"
          )

          # If Yahoo explicitly rate-limits/blocks, stop the remaining queries for that run.
          old_catch = """    errors.push({ mode: 'recent', query, message: String(err?.message ?? err) });
              console.error(`[recent error] ${query}: ${String(err?.message ?? err)}`);"""
          new_catch = """    const message = String(err?.message ?? err);
              errors.push({ mode: 'recent', query, message });
              console.error(`[recent error] ${query}: ${message}`);
              if (message.includes('ACCESS_BLOCKED')) break;"""
          if old_catch in c:
              c = c.replace(old_catch, new_catch, 1)
          cp.write_text(c, encoding="utf-8")

          # Do not impersonate a browser to Yahoo; do not retry 403/429.
          yp = Path("scripts/yahoo.mjs")
          y = yp.read_text(encoding="utf-8")
          y = y.replace(
              "  'user-agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/154.0.0.0 Safari/537.36',\n",
              ""
          )
          y = y.replace("  'referer': 'https://search.yahoo.co.jp/realtime/search'\n", "")
          y = y.replace("  retryCount = 2,", "  retryCount = 0,")
          y = y.replace("  retryCount = 2,\n  fetchImpl", "  retryCount = 0,\n  fetchImpl")
          y = y.replace(
              "      if (!res.ok) throw new Error(`HTTP ${res.status}`);",
              "      if (res.status === 403 || res.status === 429) throw new Error(`ACCESS_BLOCKED HTTP ${res.status}`);\n      if (!res.ok) throw new Error(`HTTP ${res.status}`);"
          )
          y = y.replace(
              "      lastError = err;\n      if (attempt >= retryCount) break;",
              "      lastError = err;\n      if (String(err?.message ?? err).includes('ACCESS_BLOCKED')) throw err;\n      if (attempt >= retryCount) break;"
          )
          yp.write_text(y, encoding="utf-8")

          # OCR stays enabled. Stop storing OCR text previews; recognition results stay cached.
          ip = Path("scripts/image-ocr.mjs")
          s = ip.read_text(encoding="utf-8")
          s = s.replace(
              "        candidatePasses: candidates.length,\n        textPreview: summarizeTextPreviews(previews)",
              "        candidatePasses: candidates.length"
          )
          ip.write_text(s, encoding="utf-8")

          # Move existing operational JSON and remove old OCR preview text.
          store = Path(".collector-data")
          store.mkdir(exist_ok=True)
          for name in ("posts.json", "state.json", "ocr-cache.json"):
              src = Path("docs/data") / name
              dst = store / name
              if src.exists() and not dst.exists():
                  dst.write_bytes(src.read_bytes())
              if src.exists():
                  src.unlink()

          cachep = store / "ocr-cache.json"
          if cachep.exists():
              try:
                  cache = json.loads(cachep.read_text(encoding="utf-8"))
                  if isinstance(cache, dict):
                      for item in cache.values():
                          if isinstance(item, dict):
                              item.pop("textPreview", None)
                  cachep.write_text(json.dumps(cache, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
              except Exception:
                  pass

          # Update explanation only; ranking UI/logic is unchanged.
          index = Path("docs/index.html")
          html = index.read_text(encoding="utf-8")
          html = html.replace(
              '<p class="lead">公開X検索で見つかった「求 / 譲・出」を集計し、初回から現在より前の直近7日も遡って、需要供給比を24時間・48時間・1週間で比較します。</p>',
              '<p class="lead">公開X検索で見つかった「求 / 譲・出」を低頻度で集計し、需要供給比を24時間・48時間・1週間で比較します。8つの検索条件と画像OCRを維持し、不要な大量再取得だけを減らしています。</p>'
          )
          old_method = 'Yahoo!リアルタイム検索で取得できる公開Xポストをページ送りし、初回から直近7日を遡及収集します。本文に加えて、GameWithなどのトレード画像メーカー画像も日本語OCRで解析します。小さいカード画像が複数並ぶメーカー画像に対応するため、拡大・二値化・分割OCRを行います。「欲しいカード / 求」を需要、「出せるカード / 譲」を供給として★2サポート名を照合し、Yahoo!リアルタイム検索で取得した検索ヒットを基準に集計します。通常は30分ごとに新着を取り込み、約24時間ごとに7日分を再走査して取りこぼしを補完します。'
          new_method = 'Yahoo!リアルタイム検索の8つの公開検索条件を約4時間ごとに確認し、必要に応じて各検索最大10ページまで取得します。本文に加えてトレード画像も日本語OCRで解析します。24時間分を再確認できる設定にして、短時間の実行失敗後も取りこぼしを補いやすくしています。過去7日分の大量一括再走査とカード別大量検索は行いません。403/429が返った場合は、その実行の残りの取得を停止します。'
          html = html.replace(old_method, new_method)
          index.write_text(html, encoding="utf-8")

          readme = Path("README.md")
          r = readme.read_text(encoding="utf-8")
          if "## 品質維持・低頻度モード" not in r:
              r += """

          ## 品質維持・低頻度モード

          - 約4時間ごとに自動更新します。
          - 8つの検索条件と画像OCRを維持します。
          - 各検索は最大10ページ、24時間のフォールバック範囲を確認します。
          - 過去7日一括バックフィルとカード別大量検索は停止します。
          - 403/429では再試行・回避せず、その実行の残りの取得を停止します。
          - 公開サイトの `docs/` には集計済み `rankings.json` だけを残し、個別の運用データは `.collector-data/` に移します。
          - OCR結果は需要/供給判定だけ保持し、OCR本文プレビューは保存しません。
          """
          readme.write_text(r, encoding="utf-8")
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate
        run: |
          node --check scripts/yahoo.mjs
          node --check scripts/collector-core.mjs
          node --check scripts/collect.mjs
          node --check scripts/image-ocr.mjs
          node --check docs/app.js
          npm test

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add config/queries.json config/history.json \
            scripts/collector-core.mjs scripts/collect.mjs scripts/yahoo.mjs \
            scripts/image-ocr.mjs .collector-data docs/index.html README.md

          for f in docs/data/posts.json docs/data/state.json docs/data/ocr-cache.json; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              git rm -f "$f"
            fi
          done

          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi

          git commit -m "feat: lower collection frequency while preserving ranking quality"
          git pull --rebase origin main
          git push origin HEAD:main
