name: Tune OCR to 40x4

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/tune-ocr-40x4.yml'

permissions:
  contents: write

concurrency:
  group: pokepoke-data-write
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update OCR settings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path("config/history.json")
          data = json.loads(p.read_text(encoding="utf-8"))

          data["imageOcrMaxImagesPerPost"] = 3
          data["imageOcrMaxNewImagesPerRun"] = 40
          data["imageOcrMaxCandidatePasses"] = 4
          data["imageOcrUpscaleMinWidth"] = 1400
          data["imageOcrUpscaleMaxWidth"] = 2200
          data["imageOcrTimeoutMs"] = 20000

          p.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Commit OCR tuning
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/history.json
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "perf: tune OCR to 40 images x 4 passes"
          git pull --rebase origin main
          git push origin HEAD:main
