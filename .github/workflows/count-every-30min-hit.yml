name: Count every 30-minute search hit

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/count-every-30min-hit.yml'

permissions:
  contents: write

concurrency:
  group: pokepoke-data-write
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Count every collected search hit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("scripts/collector-core.mjs")
          s = p.read_text(encoding="utf-8")

          new_merge = """export function mergePosts(oldPosts, discovered, now, storageHorizonHours = 192) {
            const cutoff = now.getTime() - storageHorizonHours * 3600_000;

            // Keep every observation returned by each collection run.
            // If the same X status appears again on a later scheduled run,
            // that later observation remains as another count.
            return [...oldPosts, ...discovered]
              .filter(p => {
                if (!p?.id || !p?.createdAt) return false;
                const t = new Date(p.createdAt).getTime();
                return Number.isFinite(t) && t >= cutoff && t <= now.getTime() + 3600_000;
              })
              .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
          }"""

          s2, n = re.subn(
              r'export function mergePosts\(oldPosts, discovered, now, storageHorizonHours = 192\) \{.*?\n\}\n\n(?=export async function saveSnapshot)',
              new_merge + "\n\n",
              s,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit("Could not replace mergePosts()")

          p.write_text(s2, encoding="utf-8")

          # Replace the previous regression tests with the new 30-minute-run behavior.
          test = Path("tests/duplicate-counting.test.mjs")
          test.write_text("""import test from 'node:test';
          import assert from 'node:assert/strict';
          import { mergePosts } from '../scripts/collector-core.mjs';

          test('same X post found again on a later collection run is counted again', () => {
            const now = new Date('2026-10-03T05:30:00Z');
            const base = {
              id: '123456789',
              url: 'https://x.com/example/status/123456789',
              author: 'example',
              createdAt: '2026-10-03T04:00:00Z',
              query: '#ポケポケトレード',
              demand: ['ナツメ'],
              supply: ['カスミ']
            };

            const posts = mergePosts(
              [{ ...base }],
              [{ ...base }],
              now,
              192
            );

            assert.equal(posts.length, 2);
          });

          test('same X post found by two queries in one run is counted twice', () => {
            const now = new Date('2026-10-03T05:30:00Z');
            const base = {
              id: '123456789',
              url: 'https://x.com/example/status/123456789',
              author: 'example',
              createdAt: '2026-10-03T04:00:00Z',
              demand: ['ナツメ'],
              supply: ['カスミ']
            };

            const posts = mergePosts([], [
              { ...base, query: '#ポケポケトレード' },
              { ...base, query: 'ポケポケ ナツメ (求 希望) (譲 出 提供)' }
            ], now, 192);

            assert.equal(posts.length, 2);
          });
          """, encoding="utf-8")
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Commit 30-minute hit counting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/collector-core.mjs tests/duplicate-counting.test.mjs
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "feat: count every scheduled search hit"
          git pull --rebase origin main
          git push origin HEAD:main
