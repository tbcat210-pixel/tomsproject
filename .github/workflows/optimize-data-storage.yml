name: Optimize data storage

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/optimize-data-storage.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reduce and prune OCR cache
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/optimize_storage.py
          python3 /tmp/optimize_storage.py

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Commit storage optimization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/history.json scripts/image-ocr.mjs
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "chore: cap OCR cache growth"
          git pull --rebase origin main
          git push origin HEAD:main
