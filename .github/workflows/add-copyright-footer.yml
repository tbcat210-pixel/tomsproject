name: Add copyright footer

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-layout-write
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add copyright and rights notice
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          copyright_block = """<!-- COPYRIGHT_NOTICE_START -->
          <div class="copyright-block">
            <p class="copyright-main">© 2026 ポケポケ☆2サポートX自動集計ランキング(β)</p>
            <p>当サイトが独自に作成した文章・プログラム・編集／構成・デザイン等（事実・数値データそのもの、および第三者の権利物を除く）は、法令上認められる引用等を除き、無断転載・再配布を禁止します。</p>
            <p>『Pokémon Trading Card Game Pocket』、ポケモンその他の名称・商標・画像等に関する権利は、各権利者に帰属します。</p>
            <p>当サイトは非公式サイトであり、各権利者・関連各社とは関係ありません。</p>
          </div>
          <!-- COPYRIGHT_NOTICE_END -->"""

          css_block = r"""
          /* COPYRIGHT_FOOTER_START */
          .site-footer{
            color:#637086;
            font-size:11px;
            text-align:center;
            padding:24px 8px 0;
            line-height:1.75;
          }
          .site-footer .footer-existing{
            margin:0 0 14px;
          }
          .site-footer .copyright-block{
            max-width:920px;
            margin:0 auto;
            padding-top:14px;
            border-top:1px solid var(--line);
          }
          .site-footer .copyright-block p{
            margin:4px 0;
          }
          .site-footer .copyright-main{
            color:#8f9bad;
            font-weight:800;
            letter-spacing:.02em;
          }
          /* COPYRIGHT_FOOTER_END */
          """

          def patch_html(path):
              p = Path(path)
              if not p.exists():
                  return False

              s = p.read_text(encoding="utf-8")
              if "COPYRIGHT_NOTICE_START" in s:
                  print(f"{path}: copyright notice already present")
                  return False

              m = re.search(r"<footer(?:\s[^>]*)?>(.*?)</footer>", s, flags=re.S)
              if m:
                  existing = m.group(1).strip()
                  footer_block = (
                      '<footer class="site-footer">\n'
                      f'  <div class="footer-existing">{existing}</div>\n\n'
                      f'  {copyright_block}\n'
                      '</footer>'
                  )
                  s = s[:m.start()] + footer_block + s[m.end():]
              elif "</main>" in s:
                  footer_block = (
                      '<footer class="site-footer">\n'
                      f'  {copyright_block}\n'
                      '</footer>'
                  )
                  s = s.replace("</main>", footer_block + "\n</main>", 1)
              else:
                  raise SystemExit(f"Could not find footer insertion point in {path}")

              p.write_text(s, encoding="utf-8")
              print(f"{path}: updated")
              return True

          def patch_css(path):
              p = Path(path)
              if not p.exists():
                  return False

              s = p.read_text(encoding="utf-8")
              if "/* COPYRIGHT_FOOTER_START */" in s:
                  print(f"{path}: copyright CSS already present")
                  return False

              s = s.rstrip() + "\n\n" + css_block.strip() + "\n"
              p.write_text(s, encoding="utf-8")
              print(f"{path}: updated")
              return True

          changed = False
          for f in ("docs/index.html", "index.html"):
              changed = patch_html(f) or changed
          for f in ("docs/styles.css", "styles.css"):
              changed = patch_css(f) or changed
          if not changed:
              print("No changes were necessary.")
          PY

      - name: Commit copyright footer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for f in docs/index.html docs/styles.css index.html styles.css; do
            if [ -e "$f" ]; then
              git add "$f"
            fi
          done

          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi

          git commit -m "feat: add copyright and rights notice"
          git pull --rebase origin main
          git push origin HEAD:main
