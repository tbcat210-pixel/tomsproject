name: Apply maximum risk reduction auto mode

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maximum-risk-reduction
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply maximum practical risk reduction
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import re
          import textwrap

          store = Path(".collector-data")
          store.mkdir(exist_ok=True)

          # A. Minimize existing stored post data.
          source_posts = Path("docs/data/posts.json")
          target_posts = store / "posts.json"

          if source_posts.exists():
              try:
                  rows = json.loads(source_posts.read_text(encoding="utf-8"))
              except Exception:
                  rows = []

              by_id = {}
              for p in rows if isinstance(rows, list) else []:
                  raw_id = str(p.get("id", "")).strip()
                  if not raw_id:
                      continue

                  anon_id = hashlib.sha256(raw_id.encode("utf-8")).hexdigest()
                  created = str(p.get("createdAt", ""))
                  if len(created) >= 13:
                      created = created[:13] + ":00:00.000Z"

                  by_id[anon_id] = {
                      "id": anon_id,
                      "createdAt": created,
                      "demand": p.get("demand", []),
                      "supply": p.get("supply", [])
                  }

              safe_rows = sorted(
                  by_id.values(),
                  key=lambda x: x.get("createdAt", ""),
                  reverse=True
              )
              target_posts.write_text(
                  json.dumps(safe_rows, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8"
              )
              source_posts.unlink()

          source_state = Path("docs/data/state.json")
          target_state = store / "state.json"
          if source_state.exists():
              try:
                  state = json.loads(source_state.read_text(encoding="utf-8"))
              except Exception:
                  state = {}
              state.pop("lastRunErrors", None)
              state.pop("lastBackfill", None)
              state["imageOcr"] = {"enabled": False}
              target_state.write_text(
                  json.dumps(state, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8"
              )
              source_state.unlink()

          source_cache = Path("docs/data/ocr-cache.json")
          if source_cache.exists():
              source_cache.unlink()

          # B. Only three broad search queries.
          Path("config/queries.json").write_text(
              json.dumps({
                  "queries": [
                      "#ポケポケトレード",
                      "ポケポケ トレード 求 譲",
                      "ポケポケ サポート トレード"
                  ]
              }, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )

          # One page/query, no retry, 5 second pause, no OCR/backfill.
          Path("config/history.json").write_text(
              json.dumps({
                  "rankingHorizonHours": 168,
                  "storageHorizonHours": 192,
                  "recentPagesPerQuery": 1,
                  "resultsPerPage": 40,
                  "throttleMs": 5000,
                  "retryCount": 0,
                  "imageOcrEnabled": False
              }, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )

          # C. Minimal text-only Yahoo collector.
          yahoo = r'''import { createHash } from 'node:crypto';
          import { cleanText, parseTradeText, snowflakeToIso } from './lib.mjs';

          export const YAHOO_TIMELINE_ENDPOINT =
            'https://search.yahoo.co.jp/realtime/api/v1/pagination';

          const DEFAULT_HEADERS = {
            'accept': 'application/json, text/plain, */*',
            'accept-language': 'ja'
          };

          function anonymousId(rawId = '') {
            return createHash('sha256').update(String(rawId)).digest('hex');
          }

          export function stripYahooHighlight(value = '') {
            return cleanText(String(value)
              .replace(/\t\s*START\s*\t/gi, '')
              .replace(/\t\s*END\s*\t/gi, '')
              .replace(/\\t\s*START\s*\\t/gi, '')
              .replace(/\\t\s*END\s*\\t/gi, ''));
          }

          export function createdAtFromEntry(entry = {}) {
            const n = Number(entry.createdAt);
            if (Number.isFinite(n) && n > 0) {
              const ms = n > 10_000_000_000 ? n : n * 1000;
              const d = new Date(ms);
              if (!Number.isNaN(d.getTime())) return d.toISOString();
            }
            return entry.id ? snowflakeToIso(String(entry.id)) : null;
          }

          function roundToHour(iso) {
            const d = new Date(iso);
            if (Number.isNaN(d.getTime())) return iso;
            d.setUTCMinutes(0, 0, 0);
            return d.toISOString();
          }

          export function parseYahooTimelineEntry(entry, query, cards, aliases = {}) {
            if (!entry?.id) return null;

            const createdAt = createdAtFromEntry(entry);
            if (!createdAt) return null;

            const body = stripYahooHighlight(
              entry.displayTextBody ?? entry.text ?? ''
            );
            const parsed = parseTradeText(body, cards, aliases);

            if (
              !parsed.explicit ||
              (parsed.demand.length === 0 && parsed.supply.length === 0)
            ) return null;

            return {
              id: anonymousId(entry.id),
              createdAt: roundToHour(createdAt),
              demand: parsed.demand,
              supply: parsed.supply
            };
          }

          export function parseYahooTimelineResponse(
            data,
            query,
            cards,
            aliases = {}
          ) {
            const timeline = data?.timeline ?? {};
            const entries = Array.isArray(timeline.entry) ? timeline.entry : [];
            const posts = entries
              .map(e => parseYahooTimelineEntry(e, query, cards, aliases))
              .filter(Boolean);

            return {
              entries,
              posts,
              nextCursor: null,
              head: timeline.head ?? {}
            };
          }

          export async function parseYahooTimelineEntryWithImages(
            entry,
            query,
            cards,
            aliases = {}
          ) {
            return parseYahooTimelineEntry(entry, query, cards, aliases);
          }

          export async function parseYahooTimelineResponseWithImages(
            data,
            query,
            cards,
            aliases = {}
          ) {
            return parseYahooTimelineResponse(data, query, cards, aliases);
          }

          export async function fetchYahooTimelinePage(query, {
            results = 40,
            timeoutMs = 10_000,
            fetchImpl = fetch
          } = {}) {
            const params = new URLSearchParams({
              p: query,
              results: String(Math.max(1, Math.min(40, results)))
            });

            const res = await fetchImpl(
              `${YAHOO_TIMELINE_ENDPOINT}?${params}`,
              {
                headers: DEFAULT_HEADERS,
                redirect: 'follow',
                signal: AbortSignal.timeout(timeoutMs)
              }
            );

            if (res.status === 403 || res.status === 429) {
              throw new Error(`ACCESS_BLOCKED HTTP ${res.status}`);
            }
            if (!res.ok) {
              throw new Error(`HTTP ${res.status}`);
            }
            return await res.json();
          }

          export async function collectYahooQuery({
            query,
            cards,
            aliases = {},
            since,
            resultsPerPage = 40,
            fetchImpl = fetch,
            onPage = null
          }) {
            const data = await fetchYahooTimelinePage(query, {
              results: resultsPerPage,
              fetchImpl
            });
            const parsed = parseYahooTimelineResponse(
              data,
              query,
              cards,
              aliases
            );

            const sinceMs = since
              ? new Date(since).getTime()
              : -Infinity;

            const posts = parsed.posts.filter(
              p => new Date(p.createdAt).getTime() >= sinceMs
            );

            onPage?.({
              query,
              page: 1,
              entries: parsed.entries.length,
              parsedPosts: posts.length
            });

            return {
              posts,
              stats: {
                query,
                pages: 1,
                totalEntries: parsed.entries.length,
                parsedPosts: posts.length,
                reachedCutoff: false,
                exhausted: true,
                capped: false
              }
            };
          }

          export function makeCardBackfillQueries() {
            return [];
          }

          export const sleep = ms =>
            new Promise(resolve => setTimeout(resolve, ms));
          '''
          Path("scripts/yahoo.mjs").write_text(
              textwrap.dedent(yahoo).lstrip(),
              encoding="utf-8"
          )

          # D. Collector core: anonymized events only and de-dup by hash.
          core = r'''import path from 'node:path';
          import { fileURLToPath } from 'node:url';
          import { buildRankings, readJson, writeJson } from './lib.mjs';

          const __dirname = path.dirname(fileURLToPath(import.meta.url));
          export const root = path.resolve(__dirname, '..');

          export const paths = {
            posts: path.join(root, '.collector-data/posts.json'),
            rankings: path.join(root, 'docs/data/rankings.json'),
            state: path.join(root, '.collector-data/state.json'),
            ocrCache: path.join(root, '.collector-data/ocr-cache.json'),
            cards: path.join(root, 'config/cards.json'),
            queries: path.join(root, 'config/queries.json'),
            history: path.join(root, 'config/history.json')
          };

          export async function loadConfig() {
            const cardsConfig = await readJson(
              paths.cards,
              { cards: [], aliases: {} }
            );
            const queryConfig = await readJson(
              paths.queries,
              { queries: [] }
            );
            const historyConfig = await readJson(paths.history, {});
            return { cardsConfig, queryConfig, historyConfig };
          }

          export function mergePosts(
            oldPosts,
            discovered,
            now,
            storageHorizonHours = 192
          ) {
            const cutoff =
              now.getTime() - storageHorizonHours * 3600_000;

            const byId = new Map();

            for (const p of [...oldPosts, ...discovered]) {
              if (!p?.id || !p?.createdAt) continue;

              const t = new Date(p.createdAt).getTime();
              if (
                !Number.isFinite(t) ||
                t < cutoff ||
                t > now.getTime() + 3600_000
              ) continue;

              byId.set(p.id, {
                id: p.id,
                createdAt: p.createdAt,
                demand: p.demand ?? [],
                supply: p.supply ?? []
              });
            }

            return [...byId.values()]
              .sort(
                (a, b) =>
                  new Date(b.createdAt) - new Date(a.createdAt)
              );
          }

          export async function saveSnapshot({
            now,
            posts,
            cardsConfig,
            queryConfig,
            state,
            discoveredThisRun = 0,
            errors = []
          }) {
            const windows = buildRankings(
              posts,
              cardsConfig.cards,
              now
            );

            const oldest =
              posts.length ? posts.at(-1).createdAt : null;
            const newest =
              posts.length ? posts[0].createdAt : null;

            const firstSuccessfulCollectionAt =
              state.firstSuccessfulCollectionAt ||
              (posts.length ? now.toISOString() : null);

            const rankings = {
              generatedAt: now.toISOString(),
              source: {
                platform: 'X',
                discovery:
                  'Yahoo!リアルタイム検索で取得できた公開X投稿（低頻度・本文のみ）',
                xApiUsed: false,
                historicalBackfill: false,
                scope:
                  '少数の広い検索語で取得できた公開投稿の本文から「求/希望」と「譲/出/提供」を判定したもの',
                note:
                  '自動取得は低頻度で行い、画像OCR・カード別大量検索・過去7日一括遡及は行いません。個別のユーザー名、投稿URL、投稿本文、元の投稿IDは保存・公開しません。取得できない投稿は集計に含まれません。'
              },
              cards: {
                count: cardsConfig.cards.length,
                rarity: cardsConfig.rarity,
                type: cardsConfig.type,
                updatedAt: cardsConfig.updatedAt
              },
              coverage: {
                firstSuccessfulCollectionAt,
                oldestPostAt: oldest,
                newestPostAt: newest,
                storedPosts: posts.length,
                discoveredThisRun,
                queryCount: queryConfig.queries.length,
                errors: errors.map(e => ({
                  mode: e.mode,
                  message:
                    String(e.message || '').includes('ACCESS_BLOCKED')
                      ? '取得先からアクセス制限を受けたため停止'
                      : '取得エラー'
                })),
                history: null,
                imageOcr: null
              },
              windows
            };

            await writeJson(paths.posts, posts);
            await writeJson(paths.rankings, rankings);
            await writeJson(paths.state, {
              firstSuccessfulCollectionAt,
              lastRunAt: now.toISOString(),
              lastRunDiscovered: discoveredThisRun,
              imageOcr: { enabled: false }
            });

            return rankings;
          }
          '''
          Path("scripts/collector-core.mjs").write_text(
              textwrap.dedent(core).lstrip(),
              encoding="utf-8"
          )

          # E. Low-frequency collector: no OCR, no historical backfill.
          collect = r'''import { readJson } from './lib.mjs';
          import { collectYahooQuery, sleep } from './yahoo.mjs';
          import {
            loadConfig,
            mergePosts,
            paths,
            saveSnapshot
          } from './collector-core.mjs';

          const {
            cardsConfig,
            queryConfig,
            historyConfig
          } = await loadConfig();

          const now = new Date();
          const state = await readJson(paths.state, {});
          const oldPosts = await readJson(paths.posts, []);
          const discovered = [];
          const errors = [];

          const recentSince =
            new Date(now.getTime() - 6 * 3600_000);

          for (const query of queryConfig.queries) {
            try {
              const result = await collectYahooQuery({
                query,
                cards: cardsConfig.cards,
                aliases: cardsConfig.aliases,
                since: recentSince,
                resultsPerPage:
                  historyConfig.resultsPerPage ?? 40,
                onPage: ({ page, entries, parsedPosts }) =>
                  console.log(
                    `[recent] page=${page} entries=${entries} parsed=${parsedPosts}`
                  )
              });

              discovered.push(...result.posts);
            } catch (err) {
              const message = String(err?.message ?? err);
              errors.push({ mode: 'recent', message });
              console.error(`[recent error] ${message}`);

              if (message.includes('ACCESS_BLOCKED')) {
                break;
              }
            }

            await sleep(historyConfig.throttleMs ?? 5000);
          }

          const posts = mergePosts(
            oldPosts,
            discovered,
            now,
            historyConfig.storageHorizonHours ?? 192
          );

          await saveSnapshot({
            now,
            posts,
            cardsConfig,
            queryConfig,
            state,
            discoveredThisRun: discovered.length,
            errors
          });

          console.log(
            `stored=${posts.length} new=${discovered.length}`
          );
          '''
          Path("scripts/collect.mjs").write_text(
              textwrap.dedent(collect).lstrip(),
              encoding="utf-8"
          )

          Path("scripts/backfill.mjs").write_text(
              "console.error('Historical bulk backfill is disabled in maximum-risk-reduction mode.');\n"
              "process.exitCode = 1;\n",
              encoding="utf-8"
          )

          # F. Update public wording so it matches the safer implementation.
          index = Path("docs/index.html")
          html = index.read_text(encoding="utf-8")

          html = re.sub(
              r'<p class="lead">.*?</p>',
              '<p class="lead">Yahoo!リアルタイム検索で取得できた公開X投稿の本文を低頻度で集計し、★2サポートの需要・供給を24時間・48時間・1週間で比較します。個別のユーザー名・投稿URL・投稿本文は保存しません。</p>',
              html,
              count=1,
              flags=re.S
          )

          method_re = re.compile(
              r'(<section class="method">.*?<h2>集計方法</h2>\s*)<p>.*?</p>',
              re.S
          )
          html = method_re.sub(
              r'\1<p>少数の広い検索語だけを使い、約2時間ごとに1ページだけ取得します。本文中の「求 / 希望」を需要、「譲 / 出 / 提供」を供給として★2サポート名を照合します。画像OCR、カード別の大量検索、過去7日一括遡及は行いません。取得先から403・429等のアクセス制限が返った場合は、その実行を停止します。</p>',
              html,
              count=1
          )

          html = html.replace(
              '<article><strong id="historyStatus">—</strong><span>過去データ遡及</span></article>',
              '<article><strong id="historyStatus">—</strong><span>収集方式</span></article>'
          )
          html = html.replace(
              '<article><strong id="ocrStatus">—</strong><span>画像OCR</span></article>',
              '<article><strong id="ocrStatus">—</strong><span>画像解析</span></article>'
          )

          index.write_text(html, encoding="utf-8")

          app = Path("docs/app.js")
          js = app.read_text(encoding="utf-8")

          # New rankings intentionally set history/image OCR to null/disabled.
          # Keep this patch simple and avoid fragile regular expressions.
          js = js.replace(
              "historyEl.textContent='初回遡及待ち';",
              "historyEl.textContent='低頻度・逐次蓄積';"
          )
          js = js.replace(
              "ocrEl.textContent='有効';",
              "ocrEl.textContent='停止';"
          )
          js = js.replace(
              '<small>投稿ID重複排除後</small>',
              '<small>匿名ID重複排除後</small>'
          )
          app.write_text(js, encoding="utf-8")

          readme = Path("README.md")
          r = readme.read_text(encoding="utf-8")
          marker = "## 最大リスク低減モード"
          note = (
              "## 最大リスク低減モード\n\n"
              "- 約2時間ごとに自動更新します。\n"
              "- 検索語は3個だけ、各実行で各1ページだけ取得します。\n"
              "- 画像OCR、カード別大量検索、過去7日一括遡及を行いません。\n"
              "- ブラウザを装うUser-AgentやRefererを送信しません。\n"
              "- 403/429が返った場合は、その実行を停止し、回避や再試行をしません。\n"
              "- Xユーザー名、投稿URL、投稿本文、検索語、元の投稿IDを保存しません。\n"
              "- 投稿IDは取得直後にSHA-256化し、保存時刻も1時間単位に丸めます。\n"
              "- GitHub Pagesで公開する収集データは集計済み `rankings.json` のみです。\n"
              "- Yahoo!リアルタイム検索の非公式取得先を使うこと自体の規約リスクは残ります。\n"
          )
          if marker not in r:
              r = r.rstrip() + "\n\n" + note + "\n"
          readme.write_text(r, encoding="utf-8")
          PY

      - name: Replace automatic collector workflow
        shell: bash
        run: |
          cat > .github/workflows/collect.yml <<'EOF'
          name: Collect X trade data

          on:
            workflow_dispatch:
            schedule:
              - cron: '17 */2 * * *'

          permissions:
            contents: write

          concurrency:
            group: pokepoke-data-write
            cancel-in-progress: false

          jobs:
            collect:
              runs-on: ubuntu-latest
              timeout-minutes: 15

              steps:
                - uses: actions/checkout@v4
                  with:
                    ref: main
                    fetch-depth: 0

                - uses: actions/setup-node@v4
                  with:
                    node-version: 20

                - name: Syntax check
                  run: |
                    node --check scripts/yahoo.mjs
                    node --check scripts/collector-core.mjs
                    node --check scripts/collect.mjs

                - name: Collect low-frequency text-only data
                  run: node scripts/collect.mjs

                - name: Save minimized state and aggregate rankings
                  shell: bash
                  run: |
                    set -euo pipefail

                    git config user.name "github-actions[bot]"
                    git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

                    rm -rf /tmp/collector-data
                    mkdir -p /tmp/collector-data
                    cp -a .collector-data/. /tmp/collector-data/
                    cp docs/data/rankings.json /tmp/rankings.json

                    for attempt in 1 2 3; do
                      git fetch origin main
                      git reset --hard origin/main

                      rm -rf .collector-data
                      mkdir -p .collector-data
                      cp -a /tmp/collector-data/. .collector-data/

                      mkdir -p docs/data
                      cp /tmp/rankings.json docs/data/rankings.json

                      git add .collector-data docs/data/rankings.json

                      if git diff --cached --quiet; then
                        echo "No data changes."
                        exit 0
                      fi

                      git commit -m "chore: update low-risk aggregate ranking data"

                      if git push origin HEAD:main; then
                        exit 0
                      fi
                    done

                    echo "Could not save data after 3 push attempts."
                    exit 1
          EOF

      - name: Remove data no longer meant for Pages
        shell: bash
        run: |
          set -euo pipefail

          for f in \
            docs/data/posts.json \
            docs/data/ocr-cache.json \
            docs/data/state.json
          do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              git rm -f "$f"
            fi
          done

      - name: Final syntax checks
        run: |
          node --check scripts/yahoo.mjs
          node --check scripts/collector-core.mjs
          node --check scripts/collect.mjs
          node --check docs/app.js

      - name: Commit maximum-risk-reduction mode
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            .github/workflows/collect.yml \
            config/queries.json \
            config/history.json \
            scripts/yahoo.mjs \
            scripts/collector-core.mjs \
            scripts/collect.mjs \
            scripts/backfill.mjs \
            .collector-data \
            docs/index.html \
            docs/app.js \
            README.md

          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi

          git commit -m "privacy: maximize risk reduction while keeping auto updates"
          git pull --rebase origin main
          git push origin HEAD:main
