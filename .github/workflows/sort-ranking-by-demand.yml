name: Sort ranking by demand

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sort-ranking-by-demand.yml'

permissions:
  contents: write

concurrency:
  group: pokepoke-data-write
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sort rankings by demand count
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/sort_by_demand.py
          python3 /tmp/sort_by_demand.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Rebuild ranking JSON
        run: node scripts/rebuild.mjs

      - name: Commit ranking order
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/lib.mjs docs/index.html docs/data/rankings.json
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "feat: sort rankings by demand"
          git pull --rebase origin main
          git push origin HEAD:main
