name: Daily ★2 supporter audit

on:
  workflow_dispatch:
  schedule:
    # 00:37 UTC = 09:37 JST
    - cron: '37 0 * * *'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check all implemented ★2 supporters
        run: node scripts/check-star2-supporters.mjs
