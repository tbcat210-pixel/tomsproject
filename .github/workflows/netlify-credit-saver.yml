name: Apply Netlify credit saver

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/netlify-credit-saver.yml'

permissions:
  contents: write

concurrency:
  group: pokepoke-data-write
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Netlify credit saver
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scripts docs
          echo '' | base64 -d > scripts/netlify-ignore.mjs
          echo 'W2J1aWxkXQogIHB1Ymxpc2ggPSAiZG9jcyIKICBpZ25vcmUgPSAibm9kZSBzY3JpcHRzL25ldGxpZnktaWdub3JlLm1qcyIKCltbaGVhZGVyc11dCiAgZm9yID0gIi9kYXRhLyoiCiAgW2hlYWRlcnMudmFsdWVzXQogICAgQ2FjaGUtQ29udHJvbCA9ICJuby1zdG9yZSwgbWF4LWFnZT0wIgo=' | base64 -d > netlify.toml
          echo '' | base64 -d > docs/app.js
          echo '' | base64 -d > docs/index.html
          echo '' | base64 -d > docs/styles.css

      - name: Commit credit saver
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add netlify.toml scripts/netlify-ignore.mjs docs/app.js docs/index.html docs/styles.css
          if ! git diff --cached --quiet; then
            git commit -m "feat: reduce Netlify deploy credits"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
