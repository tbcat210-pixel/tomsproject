name: Improve mobile design

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/improve-mobile-design.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply mobile-friendly styles
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/mobile_patch.py
          python3 /tmp/mobile_patch.py

      - name: Commit mobile design
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/styles.css
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "feat: improve mobile layout"
          git pull --rebase origin main
          git push origin HEAD:main
