name: Enable duplicate X post counting

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/enable-duplicate-counting.yml'

permissions:
  contents: write

concurrency:
  group: duplicate-counting-config
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Change counting to keep duplicate search hits
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("scripts/collector-core.mjs")
          s = p.read_text(encoding="utf-8")

          new_merge = """export function mergePosts(oldPosts, discovered, now, storageHorizonHours = 192) {
            const byOccurrence = new Map();

            for (const p of [...oldPosts, ...discovered]) {
              if (!p?.id || !p?.createdAt) continue;

              // Duplicate-counting mode:
              // the same X status can be counted again when it was found by
              // another search query. Repeated collection of the same
              // status+query pair is still merged so scheduled runs do not
              // inflate the numbers indefinitely.
              const occurrenceKey = `${p.id}::${p.query ?? ''}`;
              const existing = byOccurrence.get(occurrenceKey);
              const score = (p.demand?.length ?? 0) + (p.supply?.length ?? 0);
              const oldScore = (existing?.demand?.length ?? 0) + (existing?.supply?.length ?? 0);

              if (!existing || score > oldScore) {
                byOccurrence.set(occurrenceKey, p);
              }
            }

            const cutoff = now.getTime() - storageHorizonHours * 3600_000;
            return [...byOccurrence.values()]
              .filter(p => {
                const t = new Date(p.createdAt).getTime();
                return Number.isFinite(t) && t >= cutoff && t <= now.getTime() + 3600_000;
              })
              .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
          }"""

          s2, n = re.subn(
              r'export function mergePosts\(oldPosts, discovered, now, storageHorizonHours = 192\) \{.*?\n\}\n\n(?=export async function saveSnapshot)',
              new_merge + "\n\n",
              s,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit("Could not replace mergePosts()")

          old_scope = "scope: '取得できた公開Xポストのうち、本文またはトレード画像から「求/希望」と「譲/出/提供」を判定できた投稿',"
          new_scope = "scope: '取得できた公開X検索ヒットのうち、本文またはトレード画像から「求/希望」と「譲/出/提供」を判定できたもの。同じXポストでも別の検索クエリで見つかった場合はそれぞれ集計',"
          if old_scope in s2:
              s2 = s2.replace(old_scope, new_scope)

          old_note = "note: '初回から直近7日を遡って取得し、その後も定期更新・日次補完します。本文に加えてGameWith等のトレード画像メーカー画像もOCR解析します。ただしYahoo!リアルタイム検索に出ない投稿、非公開投稿、取得できない画像、OCRで判別できない画像は含まれないため、X全体の完全総数ではありません。'"
          new_note = "note: '初回から直近7日を遡って取得し、その後も定期更新・日次補完します。本文に加えてGameWith等のトレード画像メーカー画像もOCR解析します。同一Xポストが複数の検索クエリに該当した場合は検索ヒットごとに重複を許して集計するため、件数はユニークなXポスト数ではありません。Yahoo!リアルタイム検索に出ない投稿、非公開投稿、取得できない画像、OCRで判別できない画像は含まれません。'"
          if old_note in s2:
              s2 = s2.replace(old_note, new_note)

          p.write_text(s2, encoding="utf-8")

          p = Path("scripts/collect.mjs")
          s = p.read_text(encoding="utf-8")
          s = s.replace(
              "discoveredThisRun: new Set(discovered.map(p => p.id)).size",
              "discoveredThisRun: discovered.length"
          )
          s = s.replace(
              "lastRunDiscovered: new Set(discovered.map(p => p.id)).size",
              "lastRunDiscovered: discovered.length"
          )
          p.write_text(s, encoding="utf-8")

          p = Path("scripts/backfill-lib.mjs")
          s = p.read_text(encoding="utf-8")
          s = s.replace(
              "discoveredPosts: new Set(discovered.map(p => p.id)).size",
              "discoveredPosts: discovered.length"
          )
          p.write_text(s, encoding="utf-8")

          p = Path("docs/index.html")
          s = p.read_text(encoding="utf-8")
          s = s.replace(
              "同じXポストはIDで重複排除します。",
              "同じXポストでも別の検索クエリで見つかった場合は、それぞれ1件として重複を許して集計します。"
          )
          p.write_text(s, encoding="utf-8")

          test = Path("tests/duplicate-counting.test.mjs")
          test.write_text("""import test from 'node:test';
          import assert from 'node:assert/strict';
          import { mergePosts } from '../scripts/collector-core.mjs';

          test('same X post counts once per different search query', () => {
            const now = new Date('2026-10-03T05:00:00Z');
            const base = {
              id: '123456789',
              url: 'https://x.com/example/status/123456789',
              author: 'example',
              createdAt: '2026-10-03T04:00:00Z',
              demand: ['ナツメ'],
              supply: ['カスミ']
            };

            const posts = mergePosts([], [
              { ...base, query: '#ポケポケトレード' },
              { ...base, query: 'ポケポケ ナツメ (求 希望) (譲 出 提供)' }
            ], now, 192);

            assert.equal(posts.length, 2);
          });

          test('same X post from the same query is not re-added every scheduled run', () => {
            const now = new Date('2026-10-03T05:00:00Z');
            const base = {
              id: '123456789',
              url: 'https://x.com/example/status/123456789',
              author: 'example',
              createdAt: '2026-10-03T04:00:00Z',
              query: '#ポケポケトレード'
            };

            const posts = mergePosts(
              [{ ...base, demand: ['ナツメ'], supply: [] }],
              [{ ...base, demand: ['ナツメ', 'ナツメ'], supply: [] }],
              now,
              192
            );

            assert.equal(posts.length, 1);
            assert.equal(posts[0].demand.length, 2);
          });
          """, encoding="utf-8")
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Commit duplicate-counting mode
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/collector-core.mjs scripts/collect.mjs scripts/backfill-lib.mjs docs/index.html tests/duplicate-counting.test.mjs
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "feat: count duplicate X search hits"
          git pull --rebase origin main
          git push origin HEAD:main
