name: Fix collect save push

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-collect-save-push.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Replace collect workflow
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > .github/workflows/collect.yml

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/collect.yml
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "fix: make collect data save resilient"
          git pull --rebase origin main
          git push origin HEAD:main
