name: Collect X trade data

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: pokepoke-data-write
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Collect recent data
        run: node scripts/collect.mjs

      - name: Save collector state and public rankings
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf /tmp/collector-data
          mkdir -p /tmp/collector-data
          cp -a .collector-data/. /tmp/collector-data/
          cp docs/data/rankings.json /tmp/rankings.json

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            rm -rf .collector-data
            mkdir -p .collector-data
            cp -a /tmp/collector-data/. .collector-data/

            mkdir -p docs/data
            cp /tmp/rankings.json docs/data/rankings.json

            git add .collector-data docs/data/rankings.json

            if git diff --cached --quiet; then
              echo "No data changes."
              exit 0
            fi

            git commit -m "chore: update low-frequency trade ranking data"

            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another commit; retrying..."
          done

          echo "Could not save data after 3 attempts."
          exit 1
