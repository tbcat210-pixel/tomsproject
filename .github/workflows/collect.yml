name: Collect X trade data

on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: write

concurrency:
  group: pokepoke-data-write
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest main
        shell: bash
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Collect recent data and rolling 7-day backfill
        run: node scripts/collect.mjs

      - name: Save collected data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf /tmp/collected-data
          mkdir -p /tmp/collected-data
          cp -a docs/data/. /tmp/collected-data/

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            rm -rf docs/data
            mkdir -p docs/data
            cp -a /tmp/collected-data/. docs/data/

            git add docs/data
            if git diff --cached --quiet; then
              echo "No data changes to save."
              exit 0
            fi

            git commit -m "chore: update X trade data"

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push raced with another commit; retrying..."
          done

          echo "Failed to save collected data after 3 attempts."
          exit 1
