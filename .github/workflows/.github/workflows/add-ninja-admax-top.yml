name: Add Ninja AdMax top ad

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/add-ninja-admax-top.yml'

permissions:
  contents: write

concurrency:
  group: site-layout-write
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Insert Ninja AdMax top ad
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path("docs/index.html")
          css = Path("docs/styles.css")

          html = index.read_text(encoding="utf-8")

          old = """    <!-- NINJA_ADMAX_TOP_START -->
              <aside class="ad-slot ad-slot-top" aria-label="広告">
                <div class="ad-label">広告</div>
                <div class="ad-placeholder">
                  <strong>広告スペース</strong>
                  <small>忍者AdMaxの広告タグを設定するとここに表示できます</small>
                </div>
              </aside>
              <!-- NINJA_ADMAX_TOP_END -->"""

          # Current repository indentation-safe replacement.
          start = html.find("    <!-- NINJA_ADMAX_TOP_START -->")
          end_marker = "    <!-- NINJA_ADMAX_TOP_END -->"
          end = html.find(end_marker)

          if start != -1 and end != -1:
              end += len(end_marker)
              new = """    <!-- NINJA_ADMAX_TOP_START -->
              <aside class="ad-slot ad-slot-top" aria-label="広告">
                <div class="ad-label">広告</div>
                <div class="ad-content">
                  <!-- admax -->
                  <script src="https://adm.shinobi.jp/s/dd5fcd83c989bbef642b0009c2e6a71b"></script>
                  <!-- admax -->
                </div>
              </aside>
              <!-- NINJA_ADMAX_TOP_END -->"""
              # Normalize indentation to match the surrounding file.
              new = "\n".join(line[6:] if line.startswith("      ") else line for line in new.splitlines())
              html = html[:start] + new + html[end:]
          else:
              raise SystemExit("Top ad marker was not found in docs/index.html")

          # GitHub Pages is now the public host, so remove the old Netlify-specific footer wording.
          html = html.replace(
              "データはGitHub上の最新集計JSONを直接読み込むため、30分ごとのデータ更新だけではNetlifyを再デプロイしません。",
              "データはGitHub上の最新集計JSONを直接読み込みます。"
          )

          index.write_text(html, encoding="utf-8")

          style = css.read_text(encoding="utf-8")
          marker = "/* NINJA_ADMAX_TOP_LIVE_START */"
          if marker not in style:
              style += r"""

          /* NINJA_ADMAX_TOP_LIVE_START */
          .ad-slot-top{
            background:transparent;
            border:0;
            padding:0;
            margin:18px 0 22px;
            text-align:center;
          }
          .ad-slot-top .ad-label{
            text-align:center;
            margin:0 0 6px;
            color:var(--muted);
            opacity:.72;
          }
          .ad-content{
            display:flex;
            justify-content:center;
            align-items:center;
            max-width:100%;
            overflow:hidden;
            text-align:center;
          }
          .ad-slot-bottom{display:none}
          @media(max-width:520px){
            .ad-slot-top{margin:14px 0 18px}
            .ad-content{max-width:100%}
          }
          /* NINJA_ADMAX_TOP_LIVE_END */
          """
              # Strip workflow indentation accidentally included in the raw block.
              style = "\n".join(
                  line[10:] if line.startswith("          ") else line
                  for line in style.splitlines()
              ) + "\n"

          css.write_text(style, encoding="utf-8")
          PY

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/styles.css
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "feat: add Ninja AdMax top ad"
          git pull --rebase origin main
          git push origin HEAD:main
